<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
  <meta name="theme-color" content="#f5f7f8">
  <title>Responder · Urpy</title>
  <link rel="stylesheet" href="chat.css">
</head>
<body data-connection="connecting" data-responder="true">
  <main class="conversation" aria-label="Conversa">
    <header class="chat-header">
      <div class="conversation-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M19 4H5a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h3l4 3v-3h7a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2Z"/><path d="M7 9h10M7 13h6"/></svg></div>
      <div class="conversation-heading"><h1>Conversa</h1><div class="connection"><span class="connection-dot" aria-hidden="true"></span><span id="status" role="status">Conectando…</span></div></div>
      <button id="music-toggle" type="button" aria-label="Reproduzir música" title="Reproduzir música"><svg class="music-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M9 18V5l11-2v13M9 8l11-2"/><ellipse cx="6" cy="18" rx="3" ry="2.5"/><ellipse cx="17" cy="16" rx="3" ry="2.5"/></svg><span id="music-label">Reproduzir</span></button>
    </header>
    <div id="messages" role="log" aria-label="Mensagens" aria-live="polite"></div>
    <p id="notice" role="alert"></p>
    <form id="composer">
      <div class="composer-field"><textarea id="text" rows="1" maxlength="4000" placeholder="Escreva uma mensagem…" aria-label="Mensagem" enterkeyhint="enter" required></textarea></div>
      <button id="send" type="submit" aria-label="Enviar mensagem" title="Enviar mensagem"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7M12 5v15"/></svg></button>
    </form>
  </main>
  <template id="empty-state"><div class="empty"><div class="empty-icon" aria-hidden="true"><svg viewBox="0 0 32 32"><path d="M25 5H7a3 3 0 0 0-3 3v14a3 3 0 0 0 3 3h5l4 4v-4h9a3 3 0 0 0 3-3V8a3 3 0 0 0-3-3Z"/><path d="M10 12h12M10 18h8"/></svg></div><h2>Tudo pronto para conversar</h2><p>Envie uma mensagem para começar.<br>O histórico fica salvo para quando você voltar.</p></div></template>
  <script src="chat.js"></script>
</body>
</html>
