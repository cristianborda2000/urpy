<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#050304" />
    <meta name="description" content="Das cinzas, um novo começo." />
    <title>Nosso novo começo</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="experience" data-experience>
      <canvas id="effects" aria-hidden="true"></canvas>
      <audio id="loveSong" src="assets/audio/grupo-5-el-secreto.mp3" loop preload="auto" playsinline></audio>

      <div class="atmosphere" aria-hidden="true">
        <div class="volumetric-light"></div>
        <div class="ground-glow"></div>
        <div class="smoke smoke--one"></div>
        <div class="smoke smoke--two"></div>
      </div>

      <section class="message" aria-label="Abrir conversa">
        <p class="message__eyebrow">DAS CINZAS, UM NOVO COMEÇO</p>
        <p class="message__subtitle">Tem um lugar aqui, só esperando a sua mensagem.</p>
        <a class="message__button" href="chat.html">
          ABRIR CHAT
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" /></svg>
        </a>
      </section>

      <button class="replay" type="button" data-replay aria-label="Repetir animação">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0-2.3 5.7M20 4v7h-7" /></svg>
      </button>
    </main>
    <script src="script.js"></script>
  </body>
</html>
